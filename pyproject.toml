[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yarbo-data-sdk"
version = "0.3.0"
description = "Python SDK for Yarbo robot devices"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.28",
    "paho-mqtt>=2.0",
    "cryptography>=41.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yarbo_robot_sdk"]
include = [
    "src/yarbo_robot_sdk/py.typed",
    "src/yarbo_robot_sdk/devices/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/yarbo_robot_sdk/**/*.py",
    "src/yarbo_robot_sdk/py.typed",
    "src/yarbo_robot_sdk/devices/*.json",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "responses>=0.23",
]
